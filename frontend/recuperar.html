<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PARKO · Recuperar contraseña</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/css/estilos.css" />
    <script type="module" src="/js/views/recuperar.view.js"></script>
  </head>
  <body>
    <main class="template-auth-layout" id="contenido">
      <section class="molecule-panel template-auth-layout-panel" aria-labelledby="auth-titulo">
        <div class="molecule-panel-head template-auth-layout-head">
          <a class="molecule-brand molecule-brand--link" href="/">
            <span class="atom-brand-mark" aria-hidden="true">P</span>
            <div>PARKO<small>Parking Lot ABC</small></div>
          </a>
        </div>
        <div class="atom-hazard-strip" aria-hidden="true"></div>

        <div class="molecule-panel-body template-auth-layout-body">
          <h1 class="template-auth-layout-title" id="auth-titulo">Recuperar contraseña</h1>
          <p class="template-auth-layout-subtitle">// Le enviaremos un enlace a su correo registrado</p>
          <form class="organism-login-form" id="form-recuperar" novalidate>
            <div class="molecule-alert molecule-alert--error hidden" id="recuperar-alerta" aria-live="assertive">
              <svg class="atom-icon" aria-hidden="true" focusable="false"><use href="/assets/icons.svg#i-alert"></use></svg><p></p>
            </div>
            <div class="molecule-field">
              <label for="recuperar-tipo-documento">Tipo de documento<span class="molecule-field-required" aria-hidden="true"> *</span></label>
              <select class="atom-select" id="recuperar-tipo-documento" required aria-describedby="recuperar-tipo-documento-error">
                <option value="CC" selected>Cédula de ciudadanía (CC)</option>
                <option value="CE">Cédula de extranjería (CE)</option>
                <option value="TI">Tarjeta de identidad (TI)</option>
                <option value="PAS">Pasaporte (PAS)</option>
                <option value="NIT">NIT</option>
              </select>
              <p class="molecule-field-error" id="recuperar-tipo-documento-error" aria-live="polite"></p>
            </div>
            <div class="molecule-field">
              <label for="recuperar-numero-documento">Número de documento<span class="molecule-field-required" aria-hidden="true"> *</span></label>
              <input class="atom-input" id="recuperar-numero-documento" type="text" maxlength="20" required inputmode="numeric" autocomplete="username" autofocus aria-describedby="recuperar-numero-documento-error" />
              
              <p class="molecule-field-error" id="recuperar-numero-documento-error" aria-live="polite"></p>
            </div>
            <button class="atom-button atom-button--block" type="submit" id="recuperar-boton"><svg class="atom-icon" aria-hidden="true" focusable="false"><use href="/assets/icons.svg#i-send"></use></svg><span>Enviar enlace</span></button>
          </form>
        </div>
      </section>

      <div class="template-auth-layout-foot">
        <p><a class="atom-link" href="/login.html">← Volver al inicio de sesión</a></p>
      </div>
    </main>
  </body>
</html>
