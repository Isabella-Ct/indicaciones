<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PARKO · Error</title>

    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/styles/atomic.css" />
    <script type="module" src="/js/pages/error.js"></script>
  </head>
  <body>
    <div class="template-app-layout template-public-layout">
      <a class="skip-link" href="#contenido">Saltar al contenido</a>
      <!-- organism-header -->
      <header class="organism-header">
        <div class="organism-header-inner">
          <a class="molecule-brand molecule-brand--link" href="/">
            <span class="atom-brand-mark" aria-hidden="true">P</span>
            <div>PARKO<small id="marco-sede"></small></div>
          </a>
          <nav class="template-public-layout-actions" aria-label="Accesos">
            <a class="atom-button atom-button--sm" href="/login.html"
              ><svg class="atom-icon" aria-hidden="true" focusable="false">
                <use href="/assets/icons.svg#i-in"></use></svg
              ><span>Ingresar</span></a
            >
          </nav>
        </div>
      </header>
      <div class="atom-hazard-strip" aria-hidden="true"></div>
      <main id="contenido" tabindex="-1">
        <div class="template-app-layout-page template-public-layout-page">
          <div class="molecule-empty-state" id="error-servidor">
            <strong>Algo salió mal</strong>
            <p>
              Ocurrió un error inesperado en el servidor. Intenta de nuevo en un momento; si
              persiste, avisa al administrador.
            </p>
            <div class="molecule-empty-state-action">
              <button class="atom-button" type="button" id="error-reintentar">
                <span>Reintentar</span></button
              ><a class="atom-button atom-button--ghost" href="/"><span>Ir al inicio</span></a>
            </div>
          </div>
        </div>
      </main>
      <!-- organism-footer -->
      <footer class="organism-footer">
        <div class="organism-footer-inner">
          <p class="organism-footer-brand">PARKO</p>
          <p class="hidden" id="pie-sede"></p>

          <p>© <span id="pie-anio"></span> PARKO · Sistema de gestión de parqueaderos</p>
        </div>
      </footer>
    </div>
  </body>
</html>
