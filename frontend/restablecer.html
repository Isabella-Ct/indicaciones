<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PARKO · Restablecer contraseña</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/css/estilos.css" />
    <script type="module" src="/js/views/restablecer.view.js"></script>
  </head>
  <body>
    <main class="template-auth-layout" id="contenido">
      <section class="molecule-panel template-auth-layout-panel" aria-labelledby="auth-titulo">
        <div class="molecule-panel-head template-auth-layout-head">
          <a class="molecule-brand molecule-brand--link" href="/">
            <span class="atom-brand-mark" aria-hidden="true">P</span>
            <div>PARKO<small>Parking Lot ABC</small></div>
          </a>
        </div>
        <div class="atom-hazard-strip" aria-hidden="true"></div>

        <div class="molecule-panel-body template-auth-layout-body">
          <h1 class="template-auth-layout-title" id="auth-titulo">Restablecer contraseña</h1>
          <p class="template-auth-layout-subtitle">// Defina su nueva contraseña</p>
          <form class="organism-login-form" id="form-restablecer" novalidate>
            <div class="molecule-alert molecule-alert--error hidden" id="restablecer-alerta" aria-live="assertive">
              <svg class="atom-icon" aria-hidden="true" focusable="false"><use href="/assets/icons.svg#i-alert"></use></svg><p></p>
            </div>
            <div class="molecule-field">
              <label for="restablecer-nueva">Contraseña nueva<span class="molecule-field-required" aria-hidden="true"> *</span></label>
              <input class="atom-input" id="restablecer-nueva" type="password" maxlength="64" required autocomplete="new-password" aria-describedby="restablecer-nueva-hint restablecer-nueva-error" />
              <p class="molecule-field-hint" id="restablecer-nueva-hint" aria-live="polite">Entre 8 y 64 caracteres, con al menos una letra y un número.</p>
              <p class="molecule-field-error" id="restablecer-nueva-error" aria-live="polite"></p>
            </div>
            <div class="molecule-field">
              <label for="restablecer-confirmacion">Confirmar contraseña nueva<span class="molecule-field-required" aria-hidden="true"> *</span></label>
              <input class="atom-input" id="restablecer-confirmacion" type="password" maxlength="64" required autocomplete="new-password" aria-describedby="restablecer-confirmacion-error" />
              
              <p class="molecule-field-error" id="restablecer-confirmacion-error" aria-live="polite"></p>
            </div>
            <label class="molecule-check"><input type="checkbox" id="restablecer-mostrar" />Mostrar contraseñas</label>
            <button class="atom-button atom-button--block" type="submit" id="restablecer-boton"><svg class="atom-icon" aria-hidden="true" focusable="false"><use href="/assets/icons.svg#i-key"></use></svg><span>Guardar contraseña</span></button>
            <p class="hidden" id="restablecer-nuevo-enlace"><a class="atom-link" href="/recuperar.html">Solicitar un enlace nuevo</a></p>
          </form>
        </div>
      </section>

      <div class="template-auth-layout-foot">
        <p><a class="atom-link" href="/login.html">← Volver al inicio de sesión</a></p>
      </div>
    </main>
  </body>
</html>
